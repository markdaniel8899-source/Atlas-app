<svg width="220" height="220" viewBox="0 0 110 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="110" height="110" rx="24" fill="url(#bgGradient)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b1440"/>
      <stop offset="100%" stop-color="#0a0817"/>
    </linearGradient>
  </defs>

  <!-- Header: ATLAS wordmark + LV pill with award icon -->
  <text x="12" y="22" font-family="CreateFuture, sans-serif" font-size="11" font-weight="400" letter-spacing="1.5" fill="#cf9eff">ATLAS</text>
  
  <!-- LV pill with award icon -->
  <rect x="58" y="12" width="40" height="20" rx="10" fill="rgba(207,158,255,0.08)" stroke="rgba(207,158,255,0.18)" stroke-width="1"/>
  <svg x="62" y="14" width="8" height="8" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526" stroke="#cf9eff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="8" r="6" stroke="#cf9eff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <text x="73" y="26" font-size="8" font-weight="700" fill="#cf9eff" letter-spacing="0.5">LV 2</text>

  <!-- Body: Streak -->
  <svg x="12" y="38" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4" stroke="#cf9eff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  
  <text x="36" y="52" font-size="24" font-weight="800" fill="#ffffff">3</text>
  <text x="36" y="62" font-size="9" fill="rgba(255,255,255,0.55)">day streak</text>

  <!-- Focus Today -->
  <svg x="12" y="72" width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 2h4M12 14l3-3M12 14c0 4.418-3.582 8-8 8S4 18.418 4 14s3.582-8 8-8 8 3.582 8 8" stroke="#cf9eff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <text x="28" y="78" font-size="7" font-weight="600" fill="rgba(255,255,255,0.35)" letter-spacing="1">FOCUS TODAY</text>
  <text x="28" y="92" font-size="13" font-weight="700" fill="#ffffff">1h 24m</text>
