<svg width="500" height="220" viewBox="0 0 250 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="250" height="110" rx="24" fill="url(#bgGradient)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="250" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b1440"/>
      <stop offset="100%" stop-color="#0a0817"/>
    </linearGradient>
  </defs>

  <!-- Header: ATLAS wordmark + LV pill with award icon -->
  <text x="12" y="26" font-family="CreateFuture, sans-serif" font-size="12" font-weight="400" letter-spacing="1.5" fill="#cf9eff">ATLAS</text>
  
  <!-- LV pill with award icon -->
  <rect x="178" y="14" width="60" height="24" rx="12" fill="rgba(207,158,255,0.08)" stroke="rgba(207,158,255,0.18)" stroke-width="1"/>
  <svg x="184" y="18" width="10" height="10" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526" stroke="#cf9eff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="8" r="6" stroke="#cf9eff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <text x="196" y="31" font-size="9" font-weight="700" fill="#cf9eff" letter-spacing="0.5">LV 2</text>

  <!-- Body: Streak + Focus Today -->
  <!-- Flame icon -->
  <svg x="12" y="42" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4" stroke="#cf9eff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  
  <text x="38" y="64" font-size="32" font-weight="800" fill="#ffffff">3</text>
  <text x="38" y="76" font-size="10" fill="rgba(255,255,255,0.55)">day streak</text>

  <!-- Focus Today -->
  <text x="238" y="52" font-size="7" font-weight="600" fill="rgba(255,255,255,0.35)" letter-spacing="1.2" text-anchor="end">FOCUS TODAY</text>
  <text x="238" y="70" font-size="16" font-weight="700" fill="#ffffff" text-anchor="end">1h 24m</text>

  <!-- 7-day chart bars -->
  <g transform="translate(12, 80)">
    <!-- Mon -->
    <rect x="0" y="12" width="28" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
    <text x="14" y="30" font-size="7" font-weight="500" fill="rgba(255,255,255,0.35)" text-anchor="middle">M</text>
    <!-- Tue -->
    <rect x="33" y="8" width="28" height="8" rx="2" fill="rgba(207,158,255,0.28)"/>
    <text x="47" y="30" font-size="7" font-weight="500" fill="rgba(255,255,255,0.35)" text-anchor="middle">T</text>
    <!-- Wed -->
    <rect x="66" y="15" width="28" height="1" rx="2" fill="rgba(255,255,255,0.08)"/>
    <text x="80" y="30" font-size="7" font-weight="500" fill="rgba(255,255,255,0.35)" text-anchor="middle">W</text>
    <!-- Thu -->
    <rect x="99" y="5" width="28" height="11" rx="2" fill="rgba(207,158,255,0.28)"/>
    <text x="113" y="30" font-size="7" font-weight="500" fill="rgba(255,255,255,0.35)" text-anchor="middle">T</text>
    <!-- Fri -->
    <rect x="132" y="10" width="28" height="6" rx="2" fill="rgba(207,158,255,0.28)"/>
    <text x="146" y="30" font-size="7" font-weight="500" fill="rgba(255,255,255,0.35)" text-anchor="middle">F</text>
    <!-- Sat -->
    <rect x="165" y="14" width="28" height="2" rx="2" fill="rgba(255,255,255,0.08)"/>
    <text x="179" y="30" font-size="7" font-weight="500" fill="rgba(255,255,255,0.35)" text-anchor="middle">S</text>
    <!-- Sun (today) -->
    <rect x="198" y="0" width="28" height="16" rx="2" fill="url(#todayGradient)"/>
    <text x="212" y="30" font-size="7" font-weight="700" fill="#cf9eff" text-anchor="middle">S</text>
  </g>
  <defs>
    <linearGradient id="todayGradient" x1="0" y1="0" x2="0" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cf9eff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Footer: badges + LV -->
  <line x1="12" y1="100" x2="238" y2="100" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  
  <g transform="translate(12, 104)">
    <!-- Streak badge -->
    <text x="0" y="12" font-size="8" font-weight="600" fill="#d9c2ff" letter-spacing="0.2">🔥 7-Day Streak</text>
    <text x="100" y="12" font-size="8" font-weight="600" fill="#d9c2ff" letter-spacing="0.2">★ Bronze II</text>
    <text x="190" y="12" font-size="8" font-weight="600" fill="#d9c2ff" letter-spacing="0.2">⚡ 1,234 wk XP</text>
  </g>
  
  <text x="238" y="108" font-size="8" font-weight="700" fill="#cf9eff" letter-spacing="0.5" text-anchor="end">LV 2</text>
</svg>